<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Outer scope ring -->
  <circle cx="16" cy="16" r="12" fill="none" stroke="#4a90d9" stroke-width="1.5"/>
  <!-- Middle ring -->
  <circle cx="16" cy="16" r="7.5" fill="none" stroke="#4a90d9" stroke-width="1" stroke-dasharray="2,2"/>
  <!-- Inner ring -->
  <circle cx="16" cy="16" r="3.5" fill="none" stroke="#4a90d9" stroke-width="1" stroke-dasharray="2,2"/>
  <!-- Crosshair lines -->
  <line x1="16" y1="4" x2="16" y2="28" stroke="#4a90d9" stroke-width="1" stroke-dasharray="2,3"/>
  <line x1="4" y1="16" x2="28" y2="16" stroke="#4a90d9" stroke-width="1" stroke-dasharray="2,3"/>
  <!-- Sweep arm (at ~45°, pointing toward NE quadrant) -->
  <line x1="16" y1="16" x2="24.5" y2="7.5" stroke="#4a90d9" stroke-width="2" stroke-linecap="round"/>
  <!-- Detection blip near tip of sweep -->
  <circle cx="22" cy="10" r="2" fill="#4a90d9"/>
  <!-- Center dot -->
  <circle cx="16" cy="16" r="2" fill="#4a90d9"/>
</svg>
