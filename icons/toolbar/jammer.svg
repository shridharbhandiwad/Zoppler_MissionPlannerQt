<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Jammer body -->
  <rect x="11" y="12" width="10" height="8" rx="2" fill="#e05050" stroke="#ff8080" stroke-width="1"/>
  <!-- Antenna -->
  <line x1="16" y1="12" x2="16" y2="5" stroke="#ff8080" stroke-width="2"/>
  <!-- Transmission waves -->
  <path d="M8 8 Q4 12 8 16" fill="none" stroke="#ff6060" stroke-width="1.5" stroke-dasharray="2,1"/>
  <path d="M6 6 Q1 12 6 18" fill="none" stroke="#ff6060" stroke-width="1" stroke-dasharray="2,1" opacity="0.7"/>
  <path d="M24 8 Q28 12 24 16" fill="none" stroke="#ff6060" stroke-width="1.5" stroke-dasharray="2,1"/>
  <path d="M26 6 Q31 12 26 18" fill="none" stroke="#ff6060" stroke-width="1" stroke-dasharray="2,1" opacity="0.7"/>
  <!-- Base -->
  <rect x="9" y="20" width="14" height="3" rx="1" fill="#c03030" stroke="#ff8080" stroke-width="0.8"/>
  <!-- Signal bolt -->
  <polygon points="14,7 17,11 15,11 18,14 13,10 16,10" fill="#ffdd44"/>
